<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notificación — {{ system_name }}{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            background-color: #f1f5f9;
            padding: 30px 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .header {
            background-color: #14243a;
            padding: 24px 30px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header p {
            color: #94a3b8;
            font-size: 11px;
            margin: 4px 0 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .content {
            padding: 30px;
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            font-size: 11px;
            color: #64748b;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-success { background-color: #ecfdf5; color: #047857; }
        .badge-warning { background-color: #fffbeb; color: #b45309; }
        .badge-danger { background-color: #fef2f2; color: #b91c1c; }
        .badge-info { background-color: #eff6ff; color: #1d4ed8; }
        .card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin: 16px 0;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            border-radius: 10px;
            text-align: center;
        }
        .amount-highlight {
            font-size: 26px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1px;
            margin: 6px 0;
        }
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 12px;
        }
        table.data-table th {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 2px solid #e2e8f0;
            color: #64748b;
            font-size: 10px;
            text-transform: uppercase;
        }
        table.data-table td {
            padding: 10px;
            border-bottom: 1px solid #f1f5f9;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <h1>{{ system_name }}</h1>
                <p>Gestión Inteligente de Créditos y Cobranza</p>
            </div>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
            <div class="footer">
                <p style="margin: 0 0 6px;">Este es un mensaje automático emitido por el sistema <strong>{{ system_name }}</strong>.</p>
                <p style="margin: 0; font-size: 10px; color: #94a3b8;">Por favor no respondas a este correo. Para cualquier consulta o soporte comunícate con tu asesor de confianza.</p>
            </div>
        </div>
    </div>
</body>
</html>
