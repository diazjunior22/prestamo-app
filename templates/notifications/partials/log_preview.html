<div class="space-y-3">
    <div class="border-b border-slate-100 pb-2">
        <h4 class="text-sm font-bold text-slate-900">{{ log.subject }}</h4>
        <p class="text-xs text-slate-500">Destinatario: <strong>{{ log.recipient_email }}</strong> ({{ log.recipient_name }})</p>
        <p class="text-[11px] text-slate-400">Fecha: {{ log.created_at|date:"d/m/Y H:i:s" }}</p>
    </div>
    {% if log.error_message %}
    <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700">
        <strong>Error de envío:</strong> {{ log.error_message }}
    </div>
    {% endif %}
    {% if log.body_html %}
    <div class="border border-slate-200 rounded-xl p-3 bg-white max-h-96 overflow-y-auto">
        {{ log.body_html|safe }}
    </div>
    {% endif %}
</div>
